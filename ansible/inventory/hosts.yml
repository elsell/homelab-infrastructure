all:
  children:
    # Mini PC - Monitoring Hub
    mini_pc:
      hosts:
        lenny:
          ansible_host: 192.168.2.228
          node_exporter_port: 9100
      vars:
        ansible_user: john
        # Note: No ansible_become here - this host runs tasks as user (docker group, home dir access)

    # Hypervisors (XCP-ng)
    hypervisors:
      hosts:
        don:
          ansible_host: don.jsk
          node_exporter_port: 9100
          description: "Dell R720XD - XCP-ng dom0"
      vars:
        ansible_user: root
        ansible_become: no

    # XenOrchestra VM
    xen_orchestra:
      hosts:
        xoa:
          ansible_host: 192.168.2.94
          node_exporter_port: 9100
          # Terraform metadata
          mac_address: "fe:ed:8d:e0:83:38"
          vm_memory_gb: 4
          vm_cpus: 1
          vm_disk_gb: 20
      vars:
        ansible_user: john
        ansible_become: yes

    # Ubuntu VMs
    ubuntu_vms:
      hosts:
        cloudflare-tunnel-host:
          ansible_host: 192.168.2.9
          node_exporter_port: 9100
          # Terraform metadata
          mac_address: "ee:bb:fa:8c:71:7d"
          vm_memory_gb: 2
          vm_cpus: 2
          vm_disk_gb: 10
        bare-metal-docker:
          ansible_host: 192.168.2.96
          node_exporter_port: 9100
          # Terraform metadata
          mac_address: "00:dd:bb:aa:bb:77"
          vm_memory_gb: 3
          vm_cpus: 2
          vm_disk_gb: 50
      vars:
        ansible_user: john
        ansible_become: yes

    # Kubernetes Nodes
    k8s_nodes:
      hosts:
        k8s-dev:
          ansible_host: 192.168.2.92
          node_exporter_port: 9100
          kube_state_metrics_port: 30080
          # Terraform metadata
          mac_address: "8e:71:f9:0b:11:15"
          vm_memory_gb: 48
          vm_cpus: 16
          vm_disk_gb: 50
        k8s-prod:
          ansible_host: 192.168.2.95
          node_exporter_port: 9100
          kube_state_metrics_port: 30080
          # Terraform metadata
          mac_address: "2e:16:41:d2:d5:0e"
          vm_memory_gb: 24
          vm_cpus: 8
          vm_disk_gb: 50
      vars:
        ansible_user: user
        ansible_become: yes

    # Home Assistant (no SSH/Ansible management)
    home_assistant:
      hosts:
        home:
          ansible_host: home.jsk
          prometheus_port: 8123
          prometheus_path: /api/prometheus
          prometheus_bearer_token: "CHANGE_ME"
      vars:
        ansible_connection: local # No SSH

    # TrueNAS (no direct node-exporter, uses Graphite)
    truenas:
      hosts:
        truenas-server:
          ansible_host: truenas.jsk
          graphite_exporter: true
      vars:
        ansible_connection: local # No SSH management

    # Prometheus self-monitoring
    prometheus_server:
      hosts:
        prometheus:
          ansible_host: localhost
          prometheus_port: 9090
      vars:
        ansible_connection: local
