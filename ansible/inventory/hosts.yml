all:
  children:
    # Mini PC - Monitoring Hub
    mini_pc:
      hosts:
        lenny:
          ansible_host: 192.168.2.228
          node_exporter_port: 9100
      vars:
        ansible_user: john
        # Note: No ansible_become here - this host runs tasks as user (docker group, home dir access)

    # Hypervisors (XCP-ng)
    hypervisors:
      hosts:
        don:
          ansible_host: don.jsk
          node_exporter_port: 9100
          description: "Dell R720XD - XCP-ng dom0"
      vars:
        ansible_user: root
        ansible_become: no

    # XenOrchestra VM
    xen_orchestra:
      hosts:
        xen:
          ansible_host: xen.jsk
          node_exporter_port: 9100
      vars:
        ansible_user: john
        ansible_become: yes

    # Ubuntu VMs
    ubuntu_vms:
      hosts:
        cloudflare-tunnel-host:
          ansible_host: 192.168.2.9
          node_exporter_port: 9100
        bare-metal-docker:
          ansible_host: 192.168.2.96
          node_exporter_port: 9100
        xoa:
          ansible_host: 192.168.2.94
          node_exporter_port: 9100
      vars:
        ansible_user: john
        ansible_become: yes

    # Kubernetes Nodes
    k8s_nodes:
      hosts:
        k8s-dev:
          ansible_host: 192.168.2.92
          node_exporter_port: 9100
          kube_state_metrics_port: 30080
        k8s-prod:
          ansible_host: 192.168.2.95
          node_exporter_port: 9100
          kube_state_metrics_port: 30080
      vars:
        ansible_user: user
        ansible_become: yes

    # Home Assistant (no SSH/Ansible management)
    home_assistant:
      hosts:
        home:
          ansible_host: home.jsk
          prometheus_port: 8123
          prometheus_path: /api/prometheus
          prometheus_bearer_token: "CHANGE_ME"
      vars:
        ansible_connection: local # No SSH

    # TrueNAS (no direct node-exporter, uses Graphite)
    truenas:
      hosts:
        truenas-server:
          ansible_host: truenas.jsk
          graphite_exporter: true
      vars:
        ansible_connection: local # No SSH management

    # Prometheus self-monitoring
    prometheus_server:
      hosts:
        prometheus:
          ansible_host: localhost
          prometheus_port: 9090
      vars:
        ansible_connection: local
