---
- hosts: k8s_nodes
  become: true
  tasks:
    - name: Install packages
      apt:
        name:
          - ufw
        state: present
        update_cache: yes

    - name: Allow kubeconfig through firewall
      ufw:
        rule: allow
        port: "16443"
        proto: tcp

    - name: Enable firewall
      ufw:
        state: enabled
